name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` replays the lockfile, so the .npmrc cooldown does not apply and
      # nothing new can be resolved here.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm test
      - run: npm run build
      - run: npm run demo:build
